<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Báo khách và xem trực tiếp camera Imou">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <title>Báo khách</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>Báo khách</h1>
      <button id="settings-button" class="icon-button" type="button" aria-label="Cài đặt" title="Cài đặt">⚙</button>
    </header>

    <section id="access-panel" class="access-panel">
      <form id="key-form" class="key-form">
        <input id="app-key" type="password" autocomplete="current-password" placeholder="Mã truy cập" required>
        <button type="submit">Kết nối</button>
      </form>
      <p id="access-error" class="access-error" role="alert"></p>
    </section>

    <section id="viewer" class="viewer" hidden>
      <div id="video-stage" class="video-stage">
        <video
          id="live-video"
          class="live-video"
          muted
          playsinline
          preload="none"
          controls
          controlslist="nodownload noplaybackrate"
        ></video>
        <div id="video-message" class="video-message">Video đang tắt</div>
      </div>

      <div class="controls" aria-label="Điều khiển camera">
        <button id="video-toggle" class="control-button primary" type="button">Bật video</button>
        <button id="stream-audio-toggle" class="control-button" type="button" disabled>Bật tiếng</button>
      </div>
    </section>
  </main>

  <dialog id="settings-dialog" class="settings-dialog">
    <div class="settings-sheet">
      <div class="settings-header">
        <h2>Cài đặt</h2>
        <button id="settings-close" class="icon-button small" type="button" aria-label="Đóng">✕</button>
      </div>

      <section class="setting-row">
        <span>Trạng thái</span>
        <div id="connection-state" class="connection-state" data-connected="false" aria-live="polite">
          <span id="connection-icon" aria-hidden="true">✕</span>
          <strong id="connection-text">Chưa kết nối</strong>
        </div>
      </section>

      <section class="setting-block">
        <div class="setting-copy">
          <span>Âm báo khách</span>
          <small>Luôn bật</small>
        </div>
        <div class="segmented" role="group" aria-label="Âm lượng báo khách">
          <button class="volume-option" type="button" data-volume-level="loud">Vừa lớn</button>
          <button class="volume-option" type="button" data-volume-level="max">Rất lớn</button>
        </div>
      </section>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
